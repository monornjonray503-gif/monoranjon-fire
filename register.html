<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Register - MONORANJON</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <a class="logo" href="index.html">MONO<span>RANJON</span></a>
    <nav><a href="index.html">Home</a></nav>
  </header>

  <main class="section">
    <div class="panel">
      <h2>Create Account</h2>
      <p class="muted">Join the MONORANJON community.</p>

      <label>Your Name</label>
      <input id="name" type="text" placeholder="Full name">

      <label>Email</label>
      <input id="email" type="email" placeholder="Email address">

      <label>Password</label>
      <input id="password" type="password" placeholder="At least 6 characters">

      <button id="registerBtn" class="primary-btn full">Create Account</button>
      <button id="googleBtn" class="google-btn">Continue with Google</button>

      <p id="authMessage" class="message"></p>
      <p>Already registered? <a href="login.html">Login</a></p>
    </div>
  </main>

  <script type="module" src="auth-pages.js"></script>
</body>
</html>
